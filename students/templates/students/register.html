{% extends 'students/base.html' %}
{%  block title %}Register{% endblock %}

{% block content %}
<div class="card shadow p-4 max-auto" style="max-width: 500px;">
   <h3 class="text-center mb-4 text-primary fw-bold">Create an Account</h3> 
  
   <form method="POST">
    {%  csrf_token %}
    {% if form.errors %}
    <div class="alert-danger">Please correct the errors below
    </div>
    {% endif %}
    <div class="mb-3"><label for="id_username" class="form_label">Username</label>{{form.username}}
    </div>
    <div class="mb-3"><label for="id_email" class="form_label">Email</label>{{form.email}}
    </div>
    <div class="mb-3"><label for="id_password1" class="form_label">Password</label>{{form.password1}}
    </div>
    <div class="mb-3"><label for="id_password2" class="form_label"> Confirm Password</label>{{form.password2}}
    </div>
    <div class="d-flex justify-content-center gap-3">
      <button type="submit" class="btn btn-success">Register</button>
      <a href="{% url 'login' %}" class="btn btn-outline-secondary">Login</a>
    </div>
   </form>
</div>


    
 {% endblock %}
