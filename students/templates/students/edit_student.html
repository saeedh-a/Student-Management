
{% extends 'students/base.html' %}
{% load static %}
{%  block title %} Edit Students{% endblock %}

     {% block content %}
     <div class="card shadow p-4 max-auto" style="max-width: 600px;">
    <h3 class="text-center mb-4 text-primary fw-bold">Edit Student</h3>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
        {{ form.as_p}}
        </div>
         <div class="d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-warning px-4 text-white">Update</button>
         <a href="{% url 'student_list'%}" class="btn btn-secondary px-4">Cancel</a>
    </form>
    </div>
   {%endblock%}
