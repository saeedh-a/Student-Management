{% extends 'students/base.html' %}
{%  block title %}Login{% endblock %}

{% block content %}
<div class="card shadow p-4 "style="max-width: 450px">
   <h3 class="text-center mb-4 text-primary fw-bold">Login</h3> 

  <form method="POST">
    {%  csrf_token %}
    {%  if form.non_field_errors %}
    <div class="alert alert-danger">
      {{ form.non_field_errors}}
    </div>
    {% endif %}
    <div class="mb-3"><label for="id_username" class="form_label">Username</label>{{form.username}}
    </div>
    <div class="mb-3"><label for="id_password" class="form_label">password</label>{{form.password}}
    </div>
    <div class="d-flex justify-content-center gap-3">
      <button type="submit" class="btn btn-primary p-4">Login</button>
      <a href="{% url 'register' %}" class="btn btn-outline-secondary px-4">Register</a>
    </div>
  </form>
</div>
  {%endblock%}
